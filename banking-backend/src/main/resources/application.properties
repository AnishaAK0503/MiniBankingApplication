spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

# Keep the database schema under explicit migration control; automatic update alters
# existing PostgreSQL timestamp columns and fails on the current local DB state.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration.sql

server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/mini-banking}
banking.security.jwt.jwk-set-uri=${BANKING_SECURITY_JWT_JWK_SET_URI:}
banking.keycloak.base-url=${BANKING_KEYCLOAK_BASE_URL:http://localhost:8081}
banking.keycloak.realm=${BANKING_KEYCLOAK_REALM:mini-banking}
banking.keycloak.admin-realm=${BANKING_KEYCLOAK_ADMIN_REALM:master}
banking.keycloak.client-id=${BANKING_KEYCLOAK_CLIENT_ID:mini-banking-app}
banking.keycloak.client-secret=${BANKING_KEYCLOAK_CLIENT_SECRET:}
banking.keycloak.admin-username=${BANKING_KEYCLOAK_ADMIN_USERNAME:}
banking.keycloak.admin-password=${BANKING_KEYCLOAK_ADMIN_PASSWORD:}
banking.keycloak.temporary-password=${BANKING_KEYCLOAK_TEMPORARY_PASSWORD:bank@123}