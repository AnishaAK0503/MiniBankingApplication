<section class="feature-page">
  <div class="page-heading">
    <div>
      <p class="eyebrow">MAKER-CHECKER CONTROL</p>
      <h1>Pending Approvals</h1>
      <p class="muted">Review customer and account requests created by Makers.</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-heading">
      <h2>Approval list</h2>
      <button class="secondary-button" type="button" (click)="refresh()" [disabled]="loading">
        {{ loading ? 'Refreshing...' : 'Refresh' }}
      </button>
    </div>
    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="muted" *ngIf="!loading && !items.length && !error">No requests pending approval.</p>
    <div class="approval-list">
      <article class="approval-item" *ngFor="let item of items">
        <div class="approval-main">
          <span class="request-id">{{ item.title }}</span>
          <h2>{{ item.details }}</h2>
          <div class="approval-details">
            <span><strong>Requested by</strong>{{ item.requestedBy }}</span>
            <span><strong>Created</strong>{{ item.createdAt | date: 'medium' }}</span>
            <span><strong>Status</strong>{{ item.status }}</span>
          </div>
        </div>
        <div class="approval-actions">
          <button class="primary-button" type="button" (click)="approve(item)">Approve</button>
          <button class="danger-button" type="button" (click)="beginReject(item)">Reject</button>
        </div>
        <div class="reject-box" *ngIf="rejectingId === item.id">
          <input class="reject-input" type="text" [(ngModel)]="rejectionReason[item.id]" placeholder="Rejection reason" />
          <button class="danger-button" type="button" (click)="reject(item)" [disabled]="!(rejectionReason[item.id] || '').trim()">Submit rejection</button>
        </div>
      </article>
    </div>
  </div>
</section>
