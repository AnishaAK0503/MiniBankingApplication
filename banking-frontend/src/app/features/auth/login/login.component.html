<div class="auth-page">
  <div class="auth-card">
    <div class="brand-wrap">
      <div class="brand-icon">◈</div>
      <span>Mini Banking</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtext">Sign in securely with your Mini Banking Keycloak account.</p>

    <div class="auth-form">
      <button type="button" (click)="loginWithKeycloak()" [disabled]="loading">
        {{ loading ? 'Opening secure login...' : 'Sign in with Keycloak' }}
      </button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </div>

    <div class="switch-row">
      <span>New here?</span>
      <a routerLink="/register">Create account</a>
    </div>

    <p class="muted">Bank employees receive their role from Keycloak.</p>
  </div>
</div>
