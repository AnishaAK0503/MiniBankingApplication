<section class="feature-page">
  <div class="page-heading"><div><p class="eyebrow">CUSTOMER MANAGEMENT</p><h1>Customers</h1><p class="muted">Create and review your banking customers.</p></div></div>
  <div class="content-grid">
    <form class="panel form-panel" (ngSubmit)="createCustomer()" #customerForm="ngForm">
      <h2>New customer</h2>
      <label>Name<input name="name" [(ngModel)]="form.name" required placeholder="Full name"></label>
      <label>Email<input name="email" type="email" [(ngModel)]="form.email" required email placeholder="name@example.com"></label>
      <label>Phone<input name="phone" [(ngModel)]="form.phone" required placeholder="Phone number"></label>
      <button class="primary-button" type="submit" [disabled]="customerForm.invalid || saving">{{ saving ? 'Saving...' : 'Create customer' }}</button><p class="success" *ngIf="success">{{ success }}</p><p class="error" *ngIf="error">{{ error }}</p>
    </form>
    <div class="panel"><div class="panel-heading"><h2>Customer list</h2><button class="secondary-button" type="button" (click)="load()">Refresh</button></div><p class="error" *ngIf="error && !saving">{{ error }}</p><p class="muted" *ngIf="!loading && !customers.length">No customers found.</p><div class="table-wrap" *ngIf="customers.length"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody><tr *ngFor="let customer of customers"><td>{{ customer.name }}</td><td>{{ customer.email }}</td><td>{{ customer.phone }}</td></tr></tbody></table></div><p class="muted" *ngIf="loading">Loading customers...</p></div>
  </div>
</section>
