<section class="profile-page">
  <div class="profile-card">
    <div class="avatar-wrap">
      <div class="avatar">{{ initials }}</div>
    </div>

    <h1>{{ displayName }}</h1>
    <p class="role-badge">{{ user?.role | titlecase }}</p>

    <div class="info-grid">
      <div class="info-item">
        <span>Email</span>
        <strong>{{ user?.email || 'Not available' }}</strong>
      </div>
      <div class="info-item">
        <span>Access</span>
        <strong>{{ user?.role | titlecase }}</strong>
      </div>
      <div class="info-item" *ngIf="permissions.isCustomer">
        <span>Phone</span>
        <strong>{{ customer?.phone || 'Not available' }}</strong>
      </div>
    </div>
    <p class="error" *ngIf="profileError">{{ profileError }}</p>

    <section class="password-section" *ngIf="permissions.isCustomer">
      <h2>Change Password</h2>
      <form (ngSubmit)="changePassword()" #passwordFormRef="ngForm">
        <label>Current Password<input type="password" name="currentPassword" [(ngModel)]="passwordForm.currentPassword" required /></label>
        <label>New Password<input type="password" name="newPassword" [(ngModel)]="passwordForm.newPassword" required /></label>
        <label>Confirm New Password<input type="password" name="confirmPassword" [(ngModel)]="passwordForm.confirmPassword" required /></label>
        <p class="success" *ngIf="passwordMessage">{{ passwordMessage }}</p>
        <p class="error" *ngIf="passwordError">{{ passwordError }}</p>
        <button class="primary-btn" type="submit" [disabled]="passwordFormRef.invalid || passwordSaving">{{ passwordSaving ? 'Changing...' : 'Change Password' }}</button>
      </form>
    </section>

    <div class="actions">
      <a routerLink="/dashboard" class="primary-btn">Back to dashboard</a>
    </div>
  </div>
</section>
