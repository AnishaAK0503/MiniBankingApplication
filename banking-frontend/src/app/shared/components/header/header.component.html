<header class="header">
  <div class="page-heading"><span class="brand-mark" aria-hidden="true">▥</span><span>Mini Banking Operations</span></div>

  <div class="user-section">
    <div class="notification-backdrop" *ngIf="showNotifications" (click)="showNotifications = false"></div>
    <div class="notification-menu">
      <button class="notification-button" type="button" aria-label="Open notifications" (click)="toggleNotifications()">
        <span class="notification-glyph" aria-hidden="true"></span><b *ngIf="unreadCount">{{ unreadCount > 9 ? '9+' : unreadCount }}</b>
      </button>
      <div class="notification-popover" *ngIf="showNotifications" (click)="$event.stopPropagation()">
        <div class="notification-popover-heading"><strong>Notifications</strong><div><a routerLink="/notifications" (click)="closeNotifications()">View all</a><button class="notification-close" type="button" aria-label="Close notifications" (click)="closeNotifications()">×</button></div></div>
        <button class="notification-preview" type="button" *ngFor="let item of notifications" [class.unread]="!item.read" (click)="markRead(item)">
          <strong>{{ item.title }}</strong><span>{{ item.message }}</span>
        </button>
        <p class="muted" *ngIf="!notifications.length">No notifications.</p>
      </div>
    </div>
    <a class="user" routerLink="/profile" aria-label="Open profile">
      <div class="avatar">{{ initials }}</div>
      <div class="user-meta">
        <span class="user-name">{{ user?.name || 'Guest' }}</span>
        <small>{{ user?.role | titlecase }}</small>
      </div>
    </a>

    <button class="logout-button" type="button" (click)="logout()">Logout</button>
  </div>
</header>
