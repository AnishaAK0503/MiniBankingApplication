<header class="header">
  <div class="page-heading">Mini Banking System</div>

  <div class="user-section">
    <a class="user" routerLink="/profile" aria-label="Open profile">
      <div class="avatar">{{ initials }}</div>
      <div class="user-meta">
        <span class="user-name">{{ user?.name || 'Guest' }}</span>
        <small>{{ user?.role | titlecase }}</small>
      </div>
    </a>

    <button class="logout-button" type="button" (click)="logout()">Logout</button>
  </div>
</header>
