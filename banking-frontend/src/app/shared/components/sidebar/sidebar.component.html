<button
  class="menu-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen"
  aria-controls="main-navigation"
  aria-label="Toggle navigation menu"
>
  <span></span>
  <span></span>
  <span></span>
</button>

<div class="sidebar-backdrop" *ngIf="isOpen" (click)="close()"></div>

<aside class="sidebar" [class.open]="isOpen" id="main-navigation">
  <div class="logo">
    <span class="logo-icon">▥</span>
    <span>MINI BANKING</span>
  </div>

  <nav class="navigation">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="close()">
      <span>⌂</span>
      Dashboard
    </a>

    <a routerLink="/notifications" routerLinkActive="active" class="nav-item" (click)="close()">
      <span>!</span>
      Notifications
    </a>

    <a
      routerLink="/customers"
      routerLinkActive="active"
      class="nav-item"
      *ngIf="permissions.canManageCustomers"
      (click)="close()"
    >
      <span>◉</span>
      Customers
    </a>

    <a routerLink="/accounts" routerLinkActive="active" class="nav-item" (click)="close()">
      <span>▣</span>
      Accounts
    </a>

    <a routerLink="/transactions" routerLinkActive="active" class="nav-item" (click)="close()">
      <span>↔</span>
      Transactions
    </a>

    <a
      routerLink="/account-requests"
      routerLinkActive="active"
      class="nav-item"
      *ngIf="permissions.isMaker"
      (click)="close()"
    >
      <span>▤</span>
      Account Requests
    </a>

    <a routerLink="/beneficiaries" routerLinkActive="active" class="nav-item" (click)="close()">
      <span>♙</span>
      Beneficiaries
    </a>

    <a
      routerLink="/approvals"
      routerLinkActive="active"
      class="nav-item"
      *ngIf="permissions.canReviewTransactions"
      (click)="close()"
    >
      <span>✓</span>
      Pending Approvals
    </a>

    <a
      routerLink="/users"
      routerLinkActive="active"
      class="nav-item"
      *ngIf="permissions.canManageUsers"
      (click)="close()"
    >
      <span>♙</span>
      Users
    </a>

    <a
      routerLink="/audit-logs"
      routerLinkActive="active"
      class="nav-item"
      *ngIf="permissions.canViewAuditLogs"
      (click)="close()"
    >
      <span>▤</span>
      Audit Logs
    </a>
  </nav>
</aside>
