map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $forwarded_port {
    ~:(?<gateway_port>[0-9]+)$ $gateway_port;
    default 80;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream banking_frontend {
    zone banking_frontend 64k;
    server frontend:4000 resolve;
}

upstream banking_backend {
    zone banking_backend 64k;
    server backend:8080 resolve;
}

upstream banking_keycloak {
    zone banking_keycloak 64k;
    server keycloak:8080 resolve;
}

log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" $request_time';

server {
    listen 80;
    server_name localhost;

    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://banking_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    location = /health {
        proxy_pass http://banking_backend/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth {
        return 308 /auth/;
    }

    location /auth/ {
        proxy_pass http://banking_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://banking_frontend;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }
}
